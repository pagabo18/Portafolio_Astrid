# Production compose file used by the GitHub Actions deploy job.
# On the server: /opt/portfolio/{docker-compose.yml,.env} — volumes hold the
# database (PGlite) and the photographs, so they survive every deploy.
services:
  portfolio:
    image: ${IMAGE:-ghcr.io/pagabo18/test:latest}
    container_name: portfolio
    restart: unless-stopped
    env_file: .env
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - portfolio-data:/app/data
      - portfolio-storage:/app/storage

volumes:
  portfolio-data:
  portfolio-storage:
