name: Deploy to GitHub Pages

# Builds the static site from content/ and publishes it with GitHub Pages.
# Runs on every push to main that is not a draft-only change, and manually.
# The repository must be public (GitHub Pages is free for public repos).
# Pages is enabled automatically on the first run.

on:
  push:
    branches: [main]
    paths-ignore:
      - "content/**/draft.json"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/configure-pages@v5
        id: pages
        with:
          enablement: true # creates the Pages site on first run (public repo)
      - name: Restore processed images
        uses: actions/cache@v4
        with:
          path: .cache/media
          key: media-${{ hashFiles('content/photos.json') }}
          restore-keys: |
            media-
      - run: npm ci
      - name: Build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # "/<repo>" for project pages, "" for <user>.github.io or a custom domain
          NEXT_PUBLIC_BASE_PATH: ${{ steps.pages.outputs.base_path }}
          NEXT_PUBLIC_GITHUB_REPO: ${{ github.repository }}
          NEXT_PUBLIC_GITHUB_BRANCH: ${{ github.ref_name }}
        run: |
          npm run build
          touch out/.nojekyll
          if [ -f content/CNAME ]; then cp content/CNAME out/CNAME; fi
      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
